<form class="supplier-form" [formGroup]="form" (ngSubmit)="save()">
  <header class="form-heading">
    <div><p>SUPPLIER DIRECTORY</p><h2>{{ supplier ? 'Edit supplier' : 'Add supplier' }}</h2></div>
    <button class="close-button" type="button" aria-label="Close form" (click)="cancelled.emit()">×</button>
  </header>

  <div class="form-grid">
    <label>Supplier number <span class="required">*</span>
      <input formControlName="supplierNumber" maxlength="30" autocomplete="off" placeholder="e.g. SUP-001" />
      @if (form.controls.supplierNumber.touched && form.controls.supplierNumber.invalid) {
        <small class="field-error">Enter a supplier number (maximum 30 characters).</small>
      }
    </label>
    <label>Supplier name <span class="required">*</span>
      <input formControlName="name" maxlength="150" autocomplete="organization" placeholder="Company or supplier name" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <small class="field-error">Enter a supplier name (maximum 150 characters).</small>
      }
    </label>
    <fieldset class="service-types">
      <legend>Services offered <span class="required">*</span></legend>
      @for (option of serviceTypeOptions; track option.value) {
        <label class="checkbox-option">
          <input type="checkbox" [checked]="hasServiceType(option.value)"
            (change)="toggleServiceType(option.value, $event)" />
          <span>{{ option.label }}</span>
        </label>
      }
      @if (form.controls.serviceTypes.touched && form.controls.serviceTypes.invalid) {
        <small class="field-error">Select at least one service type.</small>
      }
    </fieldset>
    <label>Contact person
      <input formControlName="contactPerson" maxlength="120" autocomplete="name" placeholder="Contact name" />
    </label>
    <label>Email
      <input formControlName="email" type="email" maxlength="254" autocomplete="email" placeholder="name@company.com" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field-error">Enter a valid email address.</small>
      }
    </label>
    <label>Phone
      <input formControlName="phone" type="tel" maxlength="40" autocomplete="tel" placeholder="Phone number" />
    </label>
    <label class="full-width">Address
      <textarea formControlName="address" maxlength="500" rows="2" autocomplete="street-address"
        placeholder="Street, city, region, postal code"></textarea>
    </label>
    <label class="full-width">Description
      <textarea formControlName="description" maxlength="2000" rows="3"
        placeholder="Products, capabilities, or other useful notes"></textarea>
    </label>
  </div>

  <footer class="form-actions">
    <button type="button" class="secondary-button" [disabled]="saving" (click)="cancelled.emit()">Cancel</button>
    <button type="submit" class="primary-button" [disabled]="saving">
      {{ saving ? 'Saving…' : (supplier ? 'Save changes' : 'Add supplier') }}
    </button>
  </footer>
</form>
